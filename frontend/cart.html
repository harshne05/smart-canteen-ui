<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart & Slot Booking - Q-Skip</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="p-cart">

  <div class="box">
    <h2>Q-Skip Order Summary</h2>
    <div id="items-list"></div>
    
    <div class="bill-row"><span>Item Subtotal</span><span id="subtotal">₹0</span></div>
    <div class="bill-row"><span>Platform & Service Fee</span><span>₹5</span></div>
    <div class="bill-row total-bill"><span>Total Amount</span><span id="final-total">₹0</span></div>

  <div class="slot-section">
  <h3>Select Pickup Time Slot</h3>
  <select id="time-slot">

    <!-- Continuous 30-Min Slots Throughout the Day -->
    <optgroup label="Morning Slots">
      <option value="08:00 AM - 08:30 AM">08:00 AM - 08:30 AM</option>
      <option value="08:30 AM - 09:00 AM">08:30 AM - 09:00 AM</option>
      <option value="09:00 AM - 09:30 AM">09:00 AM - 09:30 AM</option>
      <option value="09:30 AM - 10:00 AM">09:30 AM - 10:00 AM</option>
      <option value="10:00 AM - 10:30 AM">10:00 AM - 10:30 AM</option>
      <option value="10:30 AM - 11:00 AM">10:30 AM - 11:00 AM</option>
      <option value="11:00 AM - 11:30 AM">11:00 AM - 11:30 AM</option>
      <option value="11:30 AM - 12:00 PM">11:30 AM - 12:00 PM</option>
    </optgroup>

    <optgroup label="Lunch & Afternoon Slots">
      <option value="12:00 PM - 12:30 PM">12:00 PM - 12:30 PM</option>
      <option value="12:30 PM - 01:00 PM">12:30 PM - 01:00 PM</option>
      <option value="01:00 PM - 01:30 PM">01:00 PM - 01:30 PM</option>
      <option value="01:25 PM - 02:00 PM ">01:25 PM - 02:00 PM </option>
      <option value="02:00 PM - 02:30 PM">02:00 PM - 02:30 PM</option>
      <option value="02:30 PM - 03:00 PM">02:30 PM - 03:00 PM</option>
      <option value="03:00 PM - 03:30 PM">03:00 PM - 03:30 PM</option>
      <option value="03:30 PM - 04:00 PM">03:30 PM - 04:00 PM</option>
    </optgroup>

    <optgroup label="Evening & Post-Class Slots">
      <option value="04:00 PM - 04:30 PM">04:00 PM - 04:30 PM</option>
      <option value="04:40 PM - 05:00 PM ">04:40 PM - 05:00 PM </option>
      <option value="05:00 PM - 05:30 PM">05:00 PM - 05:30 PM</option>
      <option value="05:30 PM - 06:00 PM">05:30 PM - 06:00 PM</option>
      <option value="06:00 PM - 06:30 PM">06:00 PM - 06:30 PM </option>
    </optgroup>
  </select>
</div>

    <button class="btn-pay" onclick="proceedToPayment()">Proceed to Payment</button>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem('qskip_cart')) || {};
    const itemsList = document.getElementById('items-list');

    let itemTotal = 0;
    const keys = Object.keys(cart);

    if (keys.length === 0) {
      itemsList.innerHTML = "<p>Your cart is empty!</p>";
    } else {
      itemsList.innerHTML = keys.map(k => {
        const item = cart[k];
        const itemCost = item.qty * item.price;
        itemTotal += itemCost;
        return `
          <div class="cart-item">
            <span>${item.name} x ${item.qty}</span>
            <span>₹${itemCost}</span>
          </div>
        `;
      }).join('');
    }

    const grandTotal = itemTotal > 0 ? itemTotal + 5 : 0;
    document.getElementById('subtotal').innerText = `₹${itemTotal}`;
    document.getElementById('final-total').innerText = `₹${grandTotal}`;

    function proceedToPayment() {
      if(keys.length === 0) return alert("Add items to cart first!");
      const selectedSlot = document.getElementById('time-slot').value;
      
      const orderData = {
        cart: cart,
        totalBill: grandTotal,
        slot: selectedSlot
      };
      
      localStorage.setItem('qskip_active_order', JSON.stringify(orderData));
      window.location.href = "/payment.html";
    }
  </script>
</body>
</html>
