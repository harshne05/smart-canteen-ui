<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Queue Status - Q-Skip</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: #171a29; color: white; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .card { background: #2b1e16; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3d2a1f; }
    .status-badge { display: inline-block; background: #FC8019; color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
    .tracker { text-align: left; margin-top: 20px; }
    .step { padding: 12px; border-left: 3px solid #444; margin-left: 20px; position: relative; color: #888; }
    .step.active { border-left-color: #60b246; color: white; font-weight: bold; }
    .step::before { content: ''; position: absolute; left: -8px; top: 15px; width: 13px; height: 13px; border-radius: 50%; background: #444; }
    .step.active::before { background: #60b246; }
    .slot-info { color: #a9abb2; font-size: 0.95rem; margin-top: 15px; }
    .btn-home { display: inline-block; margin-top: 25px; color: #FC8019; text-decoration: none; border: 1px solid #FC8019; padding: 10px 20px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <div id="status-badge" class="status-badge">Order Placed</div>
    <h2 id="status-heading">Sent to Canteen Kitchen</h2>
    
    <div class="slot-info" id="slot-disp"></div>

    <div class="tracker">
      <div id="st-1" class="step active">1. Pre-Order Received</div>
      <div id="st-2" class="step">2. Kitchen Preparing Food</div>
      <div id="st-3" class="step">3. Ready for Express Counter Pickup</div>
      <div id="st-4" class="step">4. Order Collected (Queue Skipped!)</div>
    </div>

    <a href="index.html" class="btn-home">Back to Home</a>
  </div>

  <script>
    const orderData = JSON.parse(localStorage.getItem('qskip_active_order')) || { slot: "Next Break" };
    document.getElementById('slot-disp').innerText = `Pickup Slot: ${orderData.slot}`;

    const steps = [
      { badge: "Placed", heading: "Sent to Canteen Kitchen", stepId: "st-1" },
      { badge: "Preparing", heading: "Canteen Staff is Cooking", stepId: "st-2" },
      { badge: "Ready", heading: "Ready for Counter Pickup!", stepId: "st-3" },
      { badge: "Collected", heading: "Order Pickup Successful", stepId: "st-4" }
    ];

    let currentStep = 0;

    const interval = setInterval(() => {
      currentStep++;
      if (currentStep < steps.length) {
        document.getElementById('status-badge').innerText = steps[currentStep].badge;
        document.getElementById('status-heading').innerText = steps[currentStep].heading;
        document.getElementById(steps[currentStep].stepId).classList.add('active');
      } else {
        clearInterval(interval);
      }
    }, 4000);
  </script>
</body>
</html>
